name: Verify Baritone engine fixes

# Keep only the newest verification run for this branch active.
concurrency:
  group: verify-engine-fixes-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "patches/0001-fix-litematica-volume-overflow.patch"
      - "src/main/java/baritone/utils/schematic/format/defaults/LitematicaSchematic.java"
      - "src/main/java/baritone/process/BuilderProcess.java"
      - "src/main/java/baritone/pathing/path/PathExecutor.java"
      - "src/test/java/baritone/utils/schematic/format/defaults/LitematicaSchematicSafetyTest.java"
      - "src/test/java/baritone/process/BuilderProcessPlacementRetryTest.java"
      - ".github/workflows/verify-litematica-patch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch handoff repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Retrieve upstream and integrate proposed source change
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch update/1.21.11-fabric https://github.com/Nevarielle/baritone-1.21.11.git upstream
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          target="upstream/src/main/java/baritone/utils/schematic/format/defaults/LitematicaSchematic.java"
          cp "$GITHUB_WORKSPACE/src/main/java/baritone/utils/schematic/format/defaults/LitematicaSchematic.java" "$target"
          builder="upstream/src/main/java/baritone/process/BuilderProcess.java"
          cp "$GITHUB_WORKSPACE/src/main/java/baritone/process/BuilderProcess.java" "$builder"
          path_executor="upstream/src/main/java/baritone/pathing/path/PathExecutor.java"
          cp "$GITHUB_WORKSPACE/src/main/java/baritone/pathing/path/PathExecutor.java" "$path_executor"
          test_sources=(
            "src/test/java/baritone/utils/schematic/format/defaults/LitematicaSchematicSafetyTest.java"
            "src/test/java/baritone/process/BuilderProcessPlacementRetryTest.java"
          )
          for test_source in "${test_sources[@]}"; do
            test_target="upstream/$test_source"
            mkdir -p "$(dirname "$test_target")"
            cp "$GITHUB_WORKSPACE/$test_source" "$test_target"
            # Include the newly added test in git diff output so the patch artifact is reproducible.
            git -C upstream add -N "$test_source"
          done
          git -C upstream diff --check
          git -C upstream diff -- src/main/java/baritone/utils/schematic/format/defaults/LitematicaSchematic.java src/main/java/baritone/process/BuilderProcess.java src/main/java/baritone/pathing/path/PathExecutor.java "${test_sources[@]}" > "$GITHUB_WORKSPACE/artifacts/baritone-engine-fixes.patch"

      - name: Package patched full source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cd upstream
          zip -qr "$GITHUB_WORKSPACE/artifacts/baritone-1.21.11-source-with-engine-fixes.zip" . \
            -x ".git/*" ".gradle/*" "*/.git/*" "*/.gradle/*" "*/build/*"

      - name: Run tests
        id: tests
        continue-on-error: true
        working-directory: upstream
        run: bash ./gradlew test --no-daemon

      - name: Print test failure details
        if: always()
        shell: bash
        working-directory: upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path("build/test-results/test").glob("TEST-*.xml"))
          found = False
          for report in reports:
              root = ET.parse(report).getroot()
              for case in root.iter("testcase"):
                  for failure in list(case.findall("failure")) + list(case.findall("error")):
                      found = True
                      print(f"FAILURE {case.get('classname')}.{case.get('name')}: {failure.get('message')}")
                      detail = (failure.text or "").strip()
                      print(detail[:12000])
          if not found:
              print("No JUnit XML failures were found.")
          PY

      - name: Upload JUnit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baritone-junit-test-reports
          path: upstream/build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Build Fabric remapped JAR
        id: build
        continue-on-error: true
        working-directory: upstream
        run: bash ./gradlew :fabric:remapJar --no-daemon

      - name: Upload patched full source ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baritone-1.21.11-source-with-engine-fixes
          path: artifacts/baritone-1.21.11-source-with-engine-fixes.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Upload generated patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baritone-engine-fixes-patch
          path: artifacts/baritone-engine-fixes.patch
          if-no-files-found: warn
          retention-days: 30

      - name: Upload built Fabric JAR if produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baritone-1.21.11-fabric-build
          path: upstream/fabric/build/libs/*.jar
          if-no-files-found: ignore
          retention-days: 30

      - name: Summarize verification
        if: always()
        shell: bash
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: |
          {
            echo "## Baritone engine fixes verification"
            echo "- Unit tests: ${TEST_RESULT:-not run}"
            echo "- Fabric remapped JAR build: ${BUILD_RESULT:-not run}"
            echo "- Full patched source ZIP: uploaded when patch integration and packaging succeeded"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${TEST_RESULT:-}" != "success" || "${BUILD_RESULT:-}" != "success" ]]; then
            exit 1
          fi
